name: Build Docker Image & Deploy to Coolify

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build Image & Trigger Coolify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Deployment Webhook
        run: |
          echo "Triggering Coolify deployment webhook..."
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://coolify.phoenixtech.web.id/api/v1/deploy?uuid=zryirlsw0nuhrydiy75lnoeb&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_KEY }}" \
            -H "Content-Type: application/json")
          
          body=$(echo "$response" | sed -e '$d')
          status=$(echo "$response" | tail -n1 | cut -d':' -f2)

          echo "Response Body: $body"
          echo "HTTP Status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Error: Coolify deploy webhook failed with HTTP status $status"
            exit 1
          fi

          echo "Coolify deployment triggered successfully!"
